name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q .
      - name: CLI starts
        run: python eventsHolidays.py --help

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate OpenAPI specification
        run: openapi-spec-validator openapi.yaml
      - name: API tests
        run: pytest -q

  validate-formats:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate XML, JSON and YAML files
        run: python scripts/validate_formats.py

  docker:
    runs-on: ubuntu-latest
    needs: [lint, validate-formats, test-api]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: cp .env.example .env
      - name: Build image
        run: docker compose build
      - name: Start database
        run: docker compose up -d --wait db
      - name: Smoke test
        run: |
          docker compose run --rm events login --role manager --name Luis --password luis123
          docker compose run --rm events event add --name Concert --capacity 40
          docker compose run --rm events event list
      - name: API smoke test
        run: |
          docker compose up -d --wait api
          B=http://localhost:8000
          TOKEN=$(curl -fs -X POST $B/api/v1/sessions -H 'Content-Type: application/json' \
            -d '{"role":"manager","name":"Luis","password":"luis123"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          AUTH="Authorization: Bearer $TOKEN"
          curl -fs -X POST $B/api/v1/events -H "$AUTH" -H 'Content-Type: application/json' -d '{"name":"Festival","capacity":10}'
          curl -fs -X POST $B/api/v1/registrations -H "$AUTH" -H 'Content-Type: application/json' -d '{"eventId":2,"attendee":"Ana"}'
          # deleting an event that has registrations must work (204), not break the foreign key
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE $B/api/v1/events/2 -H "$AUTH")" = 204
          curl -fs $B/ >/dev/null && curl -fs $B/docs >/dev/null
      - name: Data persists after restart
        run: |
          docker compose down
          docker compose up -d --wait api
          docker compose run --rm events event list | grep Concert
      - name: Stop services
        if: always()
        run: docker compose down -v
