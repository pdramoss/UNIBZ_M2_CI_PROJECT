name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q .
      - name: CLI starts
        run: python eventsHolidays.py --help

  validate-formats:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate XML, JSON and YAML files
        run: python scripts/validate_formats.py

  docker:
    runs-on: ubuntu-latest
    needs: [lint, validate-formats]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: cp .env.example .env
      - name: Build image
        run: docker compose build
      - name: Start database
        run: docker compose up -d --wait db
      - name: Smoke test
        run: |
          docker compose run --rm events login --role manager --name Luis --password luis123
          docker compose run --rm events event add --name Concert --capacity 40
          docker compose run --rm events event list
      - name: Stop services
        if: always()
        run: docker compose down -v
